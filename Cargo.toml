[package]
name = "rust_pacman"
version = "1.0.0"
edition = "2024"
rust-version = "1.88"

[features]
default = ["static"]
# Build SDL2 from source and link it into the executable, so it runs without
# any SDL libraries installed. Disable to link the system SDL2 instead.
static = ["sdl2/bundled", "sdl2/static-link"]

[dependencies]
png = "0.18"
sdl2 = "0.38"
ttf-parser = { version = "0.25", default-features = false, features = ["std"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
